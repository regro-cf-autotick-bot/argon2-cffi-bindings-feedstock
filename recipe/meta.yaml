{% set name = "argon2-cffi-bindings" %}
{% set version = "26.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: "63505c71542a44b68b1e38060450fb006404170da375feb31af153e7f9c6205d"

build:
  number: 0
  script_env:
    - ARGON2_CFFI_USE_SSE2=0  # [not x86_64]
  script:
    - export CMAKE_GENERATOR=Ninja
    - ln -sf $RANLIB $BUILD_PREFIX/bin/ranlib  # [unix]
    - {{ PYTHON }} -m pip install . -vv

requirements:
  # Upstream (26.1.0, PR #137 / commit 5ab01f9) switched from setuptools to
  # scikit-build-core + CMake. CFFI is no longer a build dependency: the C
  # extension source is committed as _ffi.c and compiled by CMake, so CFFI is
  # only needed at runtime. See conda-forge/argon2-cffi-bindings-feedstock#14.
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cmake >=3.20,<4.4  # pin <4.4: scikit-build-core stable-ABI/cross-compile bug (cf #14)
    - ninja
    - {{ compiler("c") }}
    - {{ stdlib("c") }}

  host:
    - python
    - pip
    - scikit-build-core >=1.0
    - setuptools-scm >=8

  run:
    - python
    - cffi >=1.0.1                           # [py < 314]
    - cffi >=2.0.0b1                         # [py >= 314]

test:
  imports:
    - _argon2_cffi_bindings
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/hynek/argon2-cffi-bindings
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Low-level Python CFFI Bindings for Argon2
  description: |
    argon2-cffi-bindings provides low-level CFFI bindings to the Argon2
    password hashing algorithm including a vendored version of them.
  doc_url: https://github.com/hynek/argon2-cffi-bindings
  dev_url: https://github.com/hynek/argon2-cffi-bindings

extra:
  recipe-maintainers:
    - stuertz
