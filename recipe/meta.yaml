{% set name = "argon2-cffi-bindings" %}
{% set version = "26.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: "63505c71542a44b68b1e38060450fb006404170da375feb31af153e7f9c6205d"

build:
  number: 2
  script_env:
    - ARGON2_CFFI_USE_SSE2=0  # [not x86_64]
  script:
    - ln -sf $RANLIB $BUILD_PREFIX/bin/ranlib  # [unix]
    # Without this CMake falls back to "Unix Makefiles" and there is no make
    # in the build env, so configuration fails before a compiler is probed.
    - export CMAKE_GENERATOR=Ninja  # [unix]
    # FindPython has to run the interpreter to locate headers, which CMP0190
    # forbids while cross-compiling. Upstream's cmake_minimum_required
    # (3.20...4.3) raises the policy max past 4.1, so the policy is NEW here
    # and every cross target fails to find Python. conda's cross-python ships
    # a native shim that answers for the target, so running it is safe.
    - export CMAKE_ARGS="${CMAKE_ARGS} -DCMAKE_CROSSCOMPILING_EMULATOR=/usr/bin/env"  # [build_platform != target_platform]
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - {{ compiler("c") }}
    - {{ stdlib("c") }}
    - cmake
    - ninja

  host:
    - python
    - pip
    - scikit-build-core >=1.0
    - setuptools_scm >=8

  run:
    - python
    - cffi >=1.0.1                           # [py < 314]
    - cffi >=2.0.0b1                         # [py >= 314]

test:
  files:
    - test_bindings.py
    - test_win_arm64.py  # [win and arm64]
  imports:
    - _argon2_cffi_bindings
  requires:
    - pip
  commands:
    - python test_bindings.py
    - python test_win_arm64.py  # [win and arm64]
    - pip check

about:
  home: https://github.com/hynek/argon2-cffi-bindings
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Low-level Python CFFI Bindings for Argon2
  description: |
    argon2-cffi-bindings provides low-level CFFI bindings to the Argon2
    password hashing algorithm including a vendored version of them.
  doc_url: https://github.com/hynek/argon2-cffi-bindings
  dev_url: https://github.com/hynek/argon2-cffi-bindings

extra:
  recipe-maintainers:
    - stuertz
